	client_max_body_size 5M;

	location ~* \/\.ht {
	    deny all;
	}	

	location ~ ^/html/(.*) {
	    proxy_pass http://127.0.0.1:8088/$1;
	    proxy_set_header Host $host;
	    proxy_set_header X-Real-IP $remote_addr;
	    proxy_set_header X-Forwarded-For $remote_addr;
	    proxy_connect_timeout 120;
	    proxy_send_timeout 120;
	    proxy_read_timeout 180;
	}


	location /koseven-personal/ {
	    include includes/koseven-personal.conf;
	}
	
	location /koseven-shop/ {
	    include includes/koseven-shop.conf;
	}

#	include "partial/error-pages";	

	location    /personal/ {
	    include includes/personal.conf;
	}

	location /basic/ {
#	    include includes/basic.conf;
	    error_page 505 /505.html;
	    root /basic/web;
	    index index.php;
	    try_files $uri  $uri/  /basic/web/index.php$is_args$args;
#	    rewrite ^/(.+)$ /basic/index.php$query_string last;
	    
		location ~ \.php$ {
#			root /usr/local/www/basic/web;# $fastcgi_script_name - basic/index.php---
			include fastcgi_params; 
			fastcgi_pass fastcgi;
			fastcgi_index index.php;
			fastcgi_param SCRIPT_FILENAME /usr/local/www$fastcgi_script_name; ##document_root
#			fastcgi_param SCRIPT_NAME $fastcgi_script_name;
#			fastcgi_param QUERY_STRING q=$uri$args;
##			fastcgi_param SCRIPT_FILENAME /usr/local/www/$kohana33/index.php; 
#			fastcgi_param KOHANA_ENV development;
		}

	}

	location ~ ^/php/(.*) {
	    include fastcgi_params; 
	    fastcgi_pass fastcgi;
	    fastcgi_index index.php;
	    fastcgi_param SCRIPT_FILENAME /usr/local/www/nginx-dist/$fastcgi_script_name; 
	    fastcgi_param SCRIPT_FILENAME $request_filename; 	
	}

	location /phpMyAdmin {
	    root /usr/local/www;
	    index index.php;
	}

	location ~ ^/phpMyAdmin.+\.php$ {
	    root /usr/local/www;
	    include fastcgi_params;
	    fastcgi_pass fastcgi;
	    fastcgi_index index.php;
	    fastcgi_param SCRIPT_FILENAME /usr/local/www/phpMyAdmin/$fastcgi_script_name; 
	    fastcgi_param SCRIPT_FILENAME $request_filename; 	

	}
	
	location ~ ^/phpMyAdmin.+\.(js|css|png|jpg|jpeg|gif|ico)$ {
	    root /usr/local/www;
	    expires max;
	}
	
	location    /phpmyadmin {
	    rewrite ^/*  /phpMyAdmin last;
	}
