	    error_page 505 /505.html;
	    root /usr/local/www/yii2-consumption/web;
	    index index.php;
	    try_files $uri $uri/ /yii2-consumption/web/index.php$is_args$args;
	    
		location ~ \.php$ {
			include fastcgi_params; 
			fastcgi_index index.php;
			fastcgi_pass 127.0.0.1:9000;
			fastcgi_param SCRIPT_FILENAME /usr/local/www$fastcgi_script_name; ##document_root
		}
	    location ~* \.(css|js|png|woff|ttf|gif|swf|woff2|jpeg|jpg|map)$ {
		index index.php index.html;
		root /usr/local/www;
	    }