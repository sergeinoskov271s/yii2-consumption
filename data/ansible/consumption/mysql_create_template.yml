##
# Example Ansible playbook that uses the MySQL module.
#

---
- hosts: dbservers
  roles:
  - role: mysql

  remote_user: root
  vars:
    database_encoding: "utf8mb4"
    database_collation: "utf8mb4_unicode_ci" 
    database_name: "consumption"

  tasks:
  - name: Drop table template
    ansible.mysql.mysql_query:
      login_unix_socket: /tmp/mysql.sock
      login_user: root
      login_password: 665010#
      login_db: "{{ database_name }}"
#      encoding: "{{ database_encoding }}"
#      collation: "{{ database_collation }}"
      query: "DROP TABLE IF EXISTS `template`;"
  - name: Create table template
    ansible.mysql.mysql_query:
      login_unix_socket: /tmp/mysql.sock
      login_user: "{{ mysql_root_login }}"
      login_password: "{{ mysql_root_password }}"
      login_db: "{{ database_name }}"
      query: "CREATE TABLE `template` (
  `id` int(11) unsigned NOT NULL AUTO_INCREMENT,	
  `towhom` varchar(200) collate utf8_unicode_ci NOT NULL DEFAULT '',
  `forwhat` varchar(200) collate utf8_unicode_ci NOT NULL DEFAULT '',
  `price` decimal(10,2) unsigned DEFAULT '0.00',
  `cat` varchar(200) collate utf8_unicode_ci NOT NULL DEFAULT '',
  PRIMARY KEY (`id`)
) ENGINE=InnoDB  DEFAULT CHARSET=utf8 COLLATE=utf8_unicode_ci AUTO_INCREMENT=5 ;" 

