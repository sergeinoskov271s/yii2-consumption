
---
- hosts: 127.0.0.1

  roles:
#  - role: mysql
  vars:
      db_name: "consumption"
      table_name: "outlay"
      dump_path: "/tmp/{{ db_name }}_{{ table_name }}_{{ ansible_date_time.date }}.sql"
      mysql_user: "{{ mysql_root_login }}"
      mysql_password: "{{ mysql_root_password }}"
  remote_user: root

  tasks:      
    - name: Delete a file if it exists {{ dump_path }}
      ansible.builtin.file:
        path: "{{ dump_path }}"
        state: absent      
    - name: Dump database table outlay
      ansible.builtin.shell:    
        cmd: "mysqldump --set-gtid-purged=OFF -u {{ mysql_user }} -p'{{ mysql_password }}' {{ db_name }} {{ table_name }} > {{ dump_path }}"
      no_log: true
      args:
        creates: "{{ dump_path }}" # Idempotency: only run if the file doesn't exist

      
      
      
      
      
      
      