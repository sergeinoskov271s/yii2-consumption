##
# Example Ansible playbook that uses the MySQL module.
#

---
- hosts: dbservers
  roles:
  - role: mysql

  remote_user: root
  vars:
    database_encoding: "utf8mb4"
    database_collation: "utf8mb4_unicode_ci" 
    database_name: "consumption"
    vars:
      ansible_python_interpreter: /usr/local/bin/python311
    table: "tag"

  tasks:
  - name: Drop table tag
    ansible.mysql.mysql_query:
      login_unix_socket: /tmp/mysql.sock
      login_user: root
      login_password: 665010#
      login_db: "{{ database_name }}"
#      encoding: "{{ database_encoding }}"
#      collation: "{{ database_collation }}"
      query: "DROP TABLE IF EXISTS `{{table}}`;"
  - name: Create table {{table}}
    ansible.mysql.mysql_query:
      login_unix_socket: /tmp/mysql.sock
      login_user: "{{ mysql_root_login }}"
      login_password: "{{ mysql_root_password }}"
      login_db: "{{ database_name }}"
      query: "CREATE TABLE `{{table}}` (
        `tag_id` int(11) unsigned NOT NULL AUTO_INCREMENT,
        `name` varchar(200) collate utf8_unicode_ci NOT NULL DEFAULT '',
        PRIMARY KEY (`tag_id`)
        ) ENGINE=InnoDB  DEFAULT CHARSET=utf8 COLLATE=utf8_unicode_ci AUTO_INCREMENT=5 ;" 
#      query: "GRANT select, update, insert, delete ON datalog TO 'user_db'@'localhost'; "
