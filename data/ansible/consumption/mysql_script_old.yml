    - name: Copy procedure
      copy: src=database.sql dest=/tmp

    - name: Import cript
      shell: cat /tmp/database.sql | mysql -u{{ mysql_root_login }} -p{{ mysql_root_password }} consumption
      
      
      
      
      
      
      